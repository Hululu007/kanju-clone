name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      ui_smoke:
        description: '跑出包关卡的 XCUITest 三项（真启动 App + 逐张截图），false 时只出 IPA'
        type: choice
        options: ['true', 'false']
        default: 'true'
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run bootstrap regression
        run: node --test ios/Tests/*.test.mjs Tests/*.test.mjs

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install ffmpeg
          mkdir -p Tests
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart Tests/sample.mp4
          ffmpeg -hide_banner -loglevel error -i Tests/sample.mp4 -c copy -hls_time 2 -hls_list_size 0 Tests/sample.m3u8
          cp ZhuijuAI/Info.plist FixtureInfo.plist
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' FixtureInfo.plist
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true' FixtureInfo.plist
          xcodegen generate

      # 后台下载的集成测试由系统的 nsurlsessiond 执行传输。headless 模拟器里这个服务
      # 偶尔没有就绪，后台会话会直接以 NSCocoaErrorDomain 4097（XPC 连不上）失败 —— 那是
      # 环境问题，不是本地网络或产品逻辑（同一地址前台请求正常）。这里把它叫起来并留下状态，
      # 测试本身也会区分「环境没起来」和「传输真的错了」。
      - name: Wake the simulator background networking daemon
        run: |
          set -uo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "device=$DEVICE" > nsurlsessiond.log
          xcrun simctl bootstatus "$DEVICE" -b >> nsurlsessiond.log 2>&1 || true
          echo "--- before ---" >> nsurlsessiond.log
          xcrun simctl spawn "$DEVICE" launchctl print system/com.apple.nsurlsessiond >> nsurlsessiond.log 2>&1 || true
          xcrun simctl spawn "$DEVICE" launchctl kickstart -k system/com.apple.nsurlsessiond >> nsurlsessiond.log 2>&1 || true
          xcrun simctl spawn "$DEVICE" launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.nsurlsessiond.plist >> nsurlsessiond.log 2>&1 || true
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE" >> nsurlsessiond.log 2>&1 || true
          sleep 5
          echo "--- after ---" >> nsurlsessiond.log
          xcrun simctl spawn "$DEVICE" launchctl print system/com.apple.nsurlsessiond >> nsurlsessiond.log 2>&1 || true
          xcrun simctl spawn "$DEVICE" launchctl list >> nsurlsessiond.log 2>&1 || true
          cat nsurlsessiond.log

      # The playback tests only use the Objective-C WKWebView APIs (see PlaybackTests.javaScript),
      # so no WebKit Swift overlay (libswiftWebKit.dylib) is needed at runtime. Do not reintroduce
      # a manual copy of that dylib: it does not exist in the Xcode 16.x simulator toolchain.
      - name: Run WKWebView playback regression on simulator
        working-directory: ios
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          python3 -m http.server 8765 --bind 127.0.0.1 --directory Tests > fixture-server.log 2>&1 &
          # 模拟器包按 Xcode 默认做 ad-hoc 签名（不要 CODE_SIGNING_ALLOWED=NO）：
          # 后台会话要连 nsurlsessiond 的 XPC 服务，未签名的测试宿主会被拒绝（4097）。
          xcodebuild -project ZhuijuAI.xcodeproj -scheme ZhuijuAI -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO INFOPLIST_FILE=FixtureInfo.plist build-for-testing | tee simulator-build.log
          codesign -dv --verbose=2 build/Build/Products/Debug-iphonesimulator/ZhuijuAI.app 2>&1 | tee -a simulator-build.log || true
          xcodebuild -project ZhuijuAI.xcodeproj -scheme ZhuijuAI -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -resultBundlePath playback-tests.xcresult CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO -only-testing:ZhuijuAITests test-without-building | tee simulator-tests.log
          xcrun xcresulttool get test-results summary --path playback-tests.xcresult | tee simulator-tests-summary.log

      - name: Build Release for device
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ZhuijuAI.xcodeproj \
            -scheme ZhuijuAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ZhuijuAI.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry ZhuijuAI-unsigned.ipa Payload
          shasum -a 256 ZhuijuAI-unsigned.ipa | tee ZhuijuAI-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZhuijuAI-unsigned-ipa
          path: |
            ios/ZhuijuAI-unsigned.ipa
            ios/ZhuijuAI-unsigned.ipa.sha256
          retention-days: 14

      # ---- 出包关卡：真启动 App、真点页面、逐张截图 ----------------------------------
      # 页面来自同机受控夹具站（无账号、不连公网），片源是真 mp4，所以截图里有真画面。
      - name: Serve the controlled fixture site
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.ui_smoke != 'false' }}
        working-directory: ios
        run: |
          set -uo pipefail
          mkdir -p UITests/Fixtures/site/media
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=640x480:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=44100 \
            -t 6 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart \
            UITests/Fixtures/site/media/fixture.mp4
          nohup python3 UITests/Fixtures/fixture_server.py --root UITests/Fixtures/site --port 8765 \
            > fixture-site.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8765/player/index.html; then break; fi
            sleep 0.5
          done
          curl -sS -o /dev/null -w 'fixture page %{http_code}\n' http://127.0.0.1:8765/player/index.html
          curl -sS -o /dev/null -w 'fixture media %{http_code} (%{size_download} bytes)\n' http://127.0.0.1:8765/media/fixture.mp4

      # 这一条是真门禁：App 起不来、页面点不动、少一档画面模式都算失败。
      # 批量下载那一项在下载队列合入前会如实变红（没有 skip 掩护）。
      - name: Run the app UI smoke and shoot every screen
        id: ui_smoke
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.ui_smoke != 'false' }}
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "device=$DEVICE" | tee ui-smoke.log
          xcrun simctl boot "$DEVICE" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$DEVICE" -b >> ui-smoke.log 2>&1 || true
          xcodebuild -project ZhuijuAI.xcodeproj -scheme ZhuijuAI \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath build \
            -resultBundlePath ui-smoke.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO INFOPLIST_FILE=FixtureInfo.plist \
            -only-testing:ZhuijuAIUITests \
            test-without-building 2>&1 | tee -a ui-smoke.log
          xcrun xcresulttool get test-results summary --path ui-smoke.xcresult \
            | tee ui-smoke-summary.log

      # 导出截图本身也要能被审：少一张必需图就非零退出。
      - name: Export the screenshots as PNG
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.ui_smoke != 'false')
        working-directory: ios
        run: |
          set -uo pipefail
          if [ -d ui-smoke.xcresult ]; then
            python3 scripts/export-ui-screenshots.py \
              --xcresult ui-smoke.xcresult --output ui-screenshots | tee ui-screenshots-export.log
            echo "export-exit=${PIPESTATUS[0]}" | tee -a ui-screenshots-export.log
          else
            echo 'no ui-smoke.xcresult (the smoke did not run)' | tee ui-screenshots-export.log
            exit 1
          fi

      - name: Upload the UI smoke screenshots
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.ui_smoke != 'false')
        uses: actions/upload-artifact@v4
        with:
          # 固定名 + commit/run 绑定：审核时 gh run download 一次就能对上这一轮
          name: ZhuijuAI-ui-smoke-${{ github.sha }}-run${{ github.run_id }}
          path: |
            ios/ui-screenshots
            ios/ui-smoke.xcresult
            ios/ui-smoke.log
            ios/ui-smoke-summary.log
            ios/ui-screenshots-export.log
            ios/fixture-site.log
          retention-days: 14

      - name: Upload playback test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZhuijuAI-playback-tests
          path: |
            ios/playback-tests.xcresult
            ios/simulator-tests.log
            ios/simulator-tests-summary.log
            ios/fixture-server.log
          retention-days: 7

      # Runs in its own step: a failing xcodebuild stops the script above (set -e),
      # so diagnostics must live where they still execute.
      - name: Export test diagnostics
        if: failure()
        working-directory: ios
        run: |
          set +e
          xcrun xcresulttool get test-results summary --path playback-tests.xcresult || true
          xcrun xcresulttool get test-results tests --path playback-tests.xcresult || true
          tail -n 200 simulator-tests.log || true
          grep -n -i 'libswiftWebKit\|Test Case .* failed\|error:' simulator-tests.log | tail -n 80 || true
          cat fixture-server.log || true
          find "$HOME/Library/Logs/DiagnosticReports" -name '*Zhuiju*' -type f -exec cat {} \; || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ZhuijuAI-xcodebuild-log
          path: |
            ios/xcodebuild.log
            ios/simulator-build.log
            ios/simulator-tests.log
          retention-days: 7
