name: ZhuijuAI
options:
  bundleIdPrefix: org.dpdns
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  ZhuijuAI:
    type: application
    platform: iOS
    sources:
      - path: ZhuijuAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dpdns.zhuiju.ios
        PRODUCT_NAME: ZhuijuAI
        INFOPLIST_FILE: ZhuijuAI/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: "NO"
  ZhuijuAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ZhuijuAI
      - sdk: WebKit.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: org.dpdns.zhuiju.ios.tests
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
schemes:
  ZhuijuAI:
    build:
      targets:
        ZhuijuAI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZhuijuAITests
    archive:
      config: Release
